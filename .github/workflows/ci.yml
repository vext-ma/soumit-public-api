name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Validate OpenAPI & JSON specs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('openapi.json'))"
          node -e "JSON.parse(require('fs').readFileSync('chatgpt-openapi.json'))"
          node -e "JSON.parse(require('fs').readFileSync('openapi-v3.0.json'))"
          node -e "JSON.parse(require('fs').readFileSync('soumit-procurement-api.postman_collection.json'))"
          echo "All JSON contracts and OpenAPI specifications are valid!"
