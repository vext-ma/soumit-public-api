# Smithery configuration for Soumit Moroccan Public Procurement MCP Server
# Registry URL: https://smithery.ai/server/@vext-ma/soumit-public-api
startCommand:
  type: stdio
  config:
    command: node
    args:
      - dist/index.js
    env:
      SOUMIT_API_URL: https://soumit.ma
      SOUMIT_API_KEY: ""
